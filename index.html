<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='4' fill='%23d7192a'/%3E%3Ctext x='18' y='24' text-anchor='middle' fill='%23fff' font-size='14' font-weight='800' font-family='Arial'%3ESD%3C/text%3E%3C/svg%3E">
  <title>SD上達_業務系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css?v=14">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="36" height="36"><rect width="36" height="36" rx="4" fill="#d7192a"/><text x="18" y="24.5" text-anchor="middle" fill="#fff" font-size="15" font-weight="800" font-family="Arial,sans-serif" letter-spacing="-0.5">SD</text></svg>
        </span>
        <div class="brand-text">
          <div class="brand-name">上達汽車</div>
          <div class="brand-en">Shang Da Motors</div>
        </div>
      </div>
    </div>
    <div class="rule"></div>
  </header>
  <div class="landing-hero">
    <p class="landing-kicker">Sales visit report</p>
    <h1 class="page-title">業務帶看回報</h1>
  </div>
  <div class="wrap">
    <a class="entry" href="./report/?mock=1">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="10" width="20" height="28" rx="2"/><path d="M18 10V8h12v2"/><path d="M18 24l5 5 9-11"/></svg>
      </span>
      <div>
        <h2>回報看車</h2>
        <p>Report a visit</p>
      </div>
    </a>
    <a class="entry kind-buy" href="./report/?mock=1&amp;view=buy">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="24" r="7"/><path d="M24 24h16M34 24v6M40 24v5"/></svg>
      </span>
      <div>
        <h2>回報收車</h2>
        <p>Report a buy-in</p>
      </div>
    </a>
    <a class="entry" href="./today/?mock=1">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="12" width="28" height="26" rx="2"/><path d="M10 20h28M18 8v8M30 8v8"/><circle cx="18" cy="28" r="1.4" fill="currentColor" stroke="none"/><circle cx="24" cy="28" r="1.4" fill="currentColor" stroke="none"/><circle cx="30" cy="28" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="33" r="1.4" fill="currentColor" stroke="none"/><circle cx="24" cy="33" r="1.4" fill="currentColor" stroke="none"/></svg>
      </span>
      <div>
        <h2>今日總結</h2>
        <p>Today</p>
      </div>
    </a>
    <a class="entry" href="./month/?mock=1">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 36V22h8v14M20 36V14h8v22M28 36V26h8v10"/></svg>
      </span>
      <div>
        <h2>本月成績（賣車／收車）</h2>
        <p>My month</p>
      </div>
    </a>
  </div>
  <p class="footnote">此頁只供預覽與部署確認，不會設成 LINE 圖文選單的入口。業務請從官方帳號的選單開啟各功能。上方連結為模擬模式（?mock=1），不會寫入正式資料。</p>
</body>
</html>
